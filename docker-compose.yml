services:
  db:
    image: postgres:16-alpine
    container_name: veylo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: veylo
      POSTGRES_PASSWORD: veylo
      POSTGRES_DB: veylo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - veylo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veylo -d veylo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  veylo-pgdata:
